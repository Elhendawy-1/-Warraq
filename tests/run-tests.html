<!DOCTYPE html>
<!-- Warraq test harness. Runs the real app logic (fetched from ../app/index.html) inside this page.
     Modes via ?run=main|reload|corrupt|iso-a|iso-b. Results are printed as JSON in <pre id="results">.
     Intended to run headless (static server + edge --headless=new --dump-dom). Works on GitHub Pages too:
     open /-Warraq/tests/run-tests.html (fetch works over http/https). -->
<html>
<head>
<meta charset="utf-8">
<title>Warraq Tests</title>
<style>body{font:13px system-ui;margin:14px}pre{white-space:pre-wrap}</style>
</head>
<body>
<h1>Warraq test run</h1>
<pre id="results">RUNNING…</pre>
<script>
(async function(){
  const MODE=new URLSearchParams(location.search).get('run')||'main';
  const R={mode:MODE,total:0,passed:0,failed:[],notes:[],net:0};
  const ok=(n,c,m)=>{R.total++;if(c)R.passed++;else R.failed.push(n+(m?' ::: '+m:''))};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function poll(f,ms=4000){const t=Date.now();while(Date.now()-t<ms){const v=f();if(v)return v;await sleep(25)}return null}
  const storeJSON=()=>localStorage.getItem('novelLibrary.v1')||'';
  const isoDate=()=>new Date().toISOString().slice(0,10);
  const mk=o=>Object.assign({},BK,o);

  const KEY='novelLibrary.v1';

    const res=await fetch('../app/index.html');ok('app file fetched over HTTP',res.ok===true,'status '+res.status);
    const src=await res.text();
    const doc=new DOMParser().parseFromString(src,'text/html');
    [...doc.head.querySelectorAll('style,link[rel=icon]')].forEach(n=>document.head.appendChild(n.cloneNode(true)));
    const code=[...doc.querySelectorAll('script')].map(s=>s.textContent).join('');
    ok('app script extracted',code.length>10000,'len='+code.length);
    ok('app has no network calls in source',!/fetch\(|XMLHttpRequest|new WebSocket|sendBeacon/.test(code));
    /* network guard: installed AFTER the harness's own boot fetch, BEFORE the app runs — counts only app runtime calls */
    ['fetch','XMLHttpRequest','WebSocket','sendBeacon'].forEach(k=>{const o=window[k];try{Object.defineProperty(window,k,{value:function(){R.net++;return o&&o.apply(this,arguments)},configurable:true,writable:true})}catch(e){}});
    if(MODE==='main')localStorage.clear();
    if(MODE==='corrupt')localStorage.setItem(KEY,'{"books":"corrupted!!not-an-array"');
    if(MODE.indexOf('iso-')===0)localStorage.clear(); /* repeatability: each isolation profile starts fresh */
    const resultsPre=document.getElementById('results');
    [...doc.body.children].forEach(n=>{if(n.tagName!=='SCRIPT')document.body.insertBefore(n.cloneNode(true),resultsPre)}); /* app markup: #app, dialogs, #imp, #toast */
    const sc=document.createElement('script');sc.textContent=code;document.body.appendChild(sc); /* executes app; Store.load() honors localStorage */
    if(MODE==='main'){
      let f=null,stSel=null,pgs=null; /* hoisted: used across test steps */

      ok('app booted with state object',S&&S.sections&&S.prefs&&Array.isArray(S.books));

      ok('LOGO path uses repo assets',LOGO==='../assets/logo.jpg');

      S.books.push(mk({id:'ar2',title:'الغربة',pages:250,page:30,status:'reading',added}));

      ok('unrelated untouched after shrink',U().pages===200&&U().page===80);
      /* ===== 10. completed book + total pages increase is NOT silently forced ===== */

      let cc=Bk.get('b1');
      ok('b1 completed again: 288 prev 100',cc.page===288&&cc.prev===100);

      const inc=Bk.get('b1');
      ok('completed + pages→400: current page stays 288 (no silent rewrite)',inc.page===288&&inc.pages===400&&inc.status==='completed');
      /* ===== 11. edit a completed book without changing status ===== */
      bookDlg(Bk.get('b5'));f=document.getElementById('bf');
      const t5=f.querySelector('[name=title]');t5.value='Completed Editable 2';fire(t5,'input');
      f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await sleep(30);
      const e5=Bk.get('b5');
      ok('edit completed book: title updated',e5.title==='Completed Editable 2');
      ok('edit completed book: progress untouched 288/288 + date kept',e5.page===288&&e5.pages===288&&e5.status==='completed'&&e5.completed===added);
      /* ===== 12. cancel-edit flows (keep editing / discard) ===== */
      bookDlg(Bk.get('b1'));f=document.getElementById('bf');
      const tb=f.querySelector('[name=title]');tb.value='SHOULD NOT PERSIST';fire(tb,'input');
      ok('dirty tracked',UI.dirty===true);

      /* create new book from series */
      pickDlg(ser1.id);
      A.picknew({dataset:{ser:ser1.id}});
      const nbf=document.getElementById('bf');
      nbf.querySelector('[name=title]').value='A Wizard of Earthsea';
      nbf.querySelector('[name=pages]').value='200';
      nbf.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await sleep(30);
      const wiz=S.books.find(b=>b.title==='A Wizard of Earthsea');
      ok('new book created directly into series',!!wiz&&Ser.inSeries(ser1,wiz.id));
      ok('new book appended with sequential order',ser1.books.length===3&&ser1.books[2].id===wiz.id&&ser1.books[2].ord===3);
      /* series progress calculation */
      const sStats=Ser.stats(ser1);
      /* b1: reading 100/288; u1: reading 80/200; wiz: unread 0/200. Total pages = 688, read = 180. 180/688*100 = 26.2% */
      ok('series stats: total 3, reading 2, unread 1',sStats.total===3&&sStats.reading===2&&sStats.unread===1);
      ok('series progress page-weighted ≈26.2%',sStats.prog===26.2,'got '+sStats.prog);
      /* live series progress update on book completion */
      A.done({dataset:{id:'b1'}});
      const sStats2=Ser.stats(ser1);
      /* b1 completed: 288/288; u1: 80/200; wiz: 0/200. Total read = 368/688 ≈ 53.5% */
      ok('series progress updates on book complete',sStats2.done===1&&sStats2.prog===53.5,'got '+sStats2.prog);
      Bk.reopen(Bk.get('b1'));
      ok('series progress updates on book reopen',Ser.stats(ser1).done===0&&Ser.stats(ser1).prog===26.2);
      /* reorder series books */
      Ser.shift(ser1.id,'u1',-1); /* u1 was #2, shift up to #1 */
      ok('series shifted up: u1 is #1, b1 is #2',ser1.books[0].id==='u1'&&ser1.books[0].ord===1&&ser1.books[1].id==='b1'&&ser1.books[1].ord===2);
      /* remove book from series without deleting it from library */
      Ser.remove(ser1,'u1');
      ok('book removed from series',!Ser.inSeries(ser1,'u1')&&ser1.books.length===2);
      ok('removed book still in library',!!Bk.get('u1'));
      /* delete book from library automatically removes from series */
      Bk.del(wiz.id);
      ok('deleted book removed from series',!Ser.inSeries(ser1,wiz.id)&&ser1.books.length===1);
      /* delete series without deleting books */
      A.serdel({dataset:{id:ser1.id}});
      await poll(()=>document.getElementById('cfm').open&&document.querySelector('#cfm button[value=ok]'));
      document.querySelector('#cfm button[value=ok]').click();await sleep(30);
      ok('series deleted',!Ser.get(ser1.id));
      ok('books survive series deletion',!!Bk.get('b1'));
      /* ===== 19c. back navigation (mobile and desktop) ===== */
      nav('lib');
      ok('nav pushes depth >= 1',history.state&&history.state.depth>=1);
      ok('back button visible on mobile and desktop',!document.getElementById('bb').hidden&&document.querySelectorAll('.back-btn').length>0);
      /* popstate back navigation */
      await applySnap({route:'dash',depth:0});
      ok('applySnap navigates to dash',UI.route==='dash');
      ok('back button hidden at root depth 0',document.getElementById('bb').hidden);
      /* popstate with unsaved changes in dialog asks confirmation */
      bookDlg(Bk.get('b1'));
      const edf=document.getElementById('bf');
      edf.querySelector('[name=title]').value='Back Test Title';
      fire(edf.querySelector('[name=title]'),'input');
      ok('form marked dirty on edit',UI.dirty===true);
      /* popstate triggers discard prompt */
      applySnap({route:'dash',depth:0});
      await poll(()=>document.getElementById('cfm').open&&document.querySelector('#cfm button[value=x]'));
      ok('unsaved back shows discard prompt',document.getElementById('cfm').open);
      document.querySelector('#cfm button[value=x]').click();await sleep(30);
      ok('cancelling discard keeps edit dialog open with edits intact',document.getElementById('dlg').open&&edf.querySelector('[name=title]').value==='Back Test Title');
      applySnap({route:'dash',depth:0});
      await poll(()=>document.getElementById('cfm').open&&document.querySelector('#cfm button[value=ok]'));
      document.querySelector('#cfm button[value=ok]').click();await sleep(30);
      ok('confirming discard closes dialog',!document.getElementById('dlg').open);
      /* ===== 19d. custom icons management ===== */
      serDlg();
      const newIcInp=document.getElementById('new_ic');
      newIcInp.value='🐉';
      A.addcustomicon(newIcInp);
      ok('custom icon 🐉 added to S.customIcons',(S.customIcons||[]).includes('🐉'));
      ok('custom icon appears in allIcons()',allIcons().includes('🐉'));
      ok('selected icon input updated',document.getElementById('sic').value==='🐉');
      const xf=document.getElementById('xf');
      xf.querySelector('[name=name]').value='Dragon Saga';
      xf.querySelector('[name=icon]').value='🐉';
      xf.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await sleep(30);
      const dragSer=S.series.find(s=>s.name==='Dragon Saga');
      ok('series created with custom icon 🐉',!!dragSer&&dragSer.icon==='🐉');
      A.delcustomicon({dataset:{i:'🐉'}});
      ok('custom icon 🐉 removed from S.customIcons',!(S.customIcons||[]).includes('🐉'));
      ok('series preserves icon even if removed from active choices',dragSer.icon==='🐉');
      /* ===== 20. erase everything ===== */
      A.reset();await poll(()=>document.getElementById('cfm').open&&document.querySelector('#cfm button[value=ok]'));
      document.querySelector('#cfm button[value=ok]').click();await sleep(40);
      ok('reset → defaults (empty: dash route, 0 books, 7 sections)',UI.route==='dash'&&S.books.length===0&&S.sections.length===7);
      /* ===== 21. re-seed canonical state for the reload run ===== */
      S=defaults();S.prefs.theme='dark';S.prefs.lang='en';
      S.books.push(mk({id:'u1',title:'Unrelated Book',author:'X',pages:200,page:80,status:'reading',added}));
      S.books.push(mk({id:'b1',title:'My Novel',pages:288,page:100,status:'reading',prev:100,added,started:added}));
      S.books.push(mk({id:'c1',title:'Done Book',pages:288,page:288,status:'completed',prev:100,added,completed:added}));
      S.series.push({id:'ser-1',name:'Canonical Series',desc:'Canonical desc',cover:'',icon:'📚',added,books:[{id:'b1',ord:1},{id:'c1',ord:2}]});
      Store.save();render();
      ok('canonical state saved for reload test',JSON.parse(storeJSON()||'null')&&JSON.parse(storeJSON()||'null').books.length===3&&JSON.parse(storeJSON()||'null').series.length===1);
      /* ===== 22. no network at runtime ===== */
      ok('zero network calls at runtime',R.net===0,'calls '+R.net);
      await sleep(50);
    }
    else if(MODE==='reload'){
      /* app booted from persisted storage — same profile, new browser process */
      ok('restored: 3 books',S.books.length===3,'got '+S.books.length);
      const b1=Bk.get('b1');
      ok('persist: b1 status reading',b1&&b1.status==='reading');
      ok('persist: reading progress survived refresh (page=100)',b1&&b1.page===100,'got '+(b1&&b1.page));
      ok('persist: b1 pages 288',b1&&b1.pages===288);
      ok('persist: b1 prev 100',b1&&b1.prev===100);
      ok('persist: completed book intact (page/prev/status)',Bk.get('c1')&&Bk.get('c1').status==='completed'&&Bk.get('c1').page===288&&Bk.get('c1').prev===100);
      ok('persist: unrelated book intact',Bk.get('u1')&&Bk.get('u1').page===80);
      ok('persist: theme=dark kept',S.prefs.theme==='dark');
      ok('persist: pct(100/288)=34.7',b1&&pct(b1)===34.7);
      ok('persist: series restored',S.series&&S.series.length===1&&S.series[0].name==='Canonical Series');
      ok('persist: series books intact',S.series&&S.series[0].books.length===2&&S.series[0].books[0].id==='b1'&&S.series[0].books[1].id==='c1');
      ok('persist: series progress intact',S.series&&Ser.stats(S.series[0]).prog>0);
      /* full undo through the dialog AFTER refresh */
      bookDlg(b1);const f=document.getElementById('bf');
      const stSel=f.querySelector('[name=status]');
      stSel.value='completed';fire(stSel,'change');
      stSel.value='reading';fire(stSel,'change');
      ok('after refresh: undo restores 100 again',f.querySelector('[name=page]').value==='100','got '+f.querySelector('[name=page]').value);
      f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await sleep(30);
      ok('after refresh: page 100 persisted',Bk.get('b1').page===100&&Bk.get('b1').status==='reading');
      S.prefs.theme='dark';Store.save();render();
    }
    else if(MODE==='corrupt'){
      ok('corrupt storage → recovery flagged',recovered===true);
      ok('corrupt storage → fresh defaults',S.books.length===0&&S.sections.length===7);
      ok('corrupt: no books invented',S.books.length===0);
      ok('corrupt copy kept aside',!!localStorage.getItem(KEY+'.corrupt')&&localStorage.getItem(KEY+'.corrupt').includes('corrupted!!not-an-array'));
      Store.save();localStorage.removeItem(KEY);localStorage.removeItem(KEY+'.corrupt');
    }
    else if(MODE==='iso-a'){
      ok('iso-a: app booted',S&&S.books);
      S.books.push(mk({id:'a-secret-1',title:'ISOL-A-MARKER-X',pages:111,page:11,status:'reading',added:isoDate()}));
      Store.save();
      ok('iso-a: seeded & visible',Bk.get('a-secret-1')&&Bk.get('a-secret-1').title==='ISOL-A-MARKER-X');
      ok('iso-a: persisted in profile A',storeJSON().includes('ISOL-A-MARKER-X'));
    }
    else if(MODE==='iso-b'){
      ok('iso-b: empty library (no cross-profile data)',S.books.length===0,'books='+S.books.length);
      ok('iso-b: no profile-A marker anywhere in storage',!storeJSON().includes('ISOL-A-MARKER-X'));
      S.books.push(mk({id:'b-secret-1',title:'ISOL-B-MARKER',pages:222,page:22,status:'reading',added:isoDate()}));
      Store.save();
      ok('iso-b: own data works & persists',Bk.get('b-secret-1')&&storeJSON().includes('ISOL-B-MARKER'));
      ok('iso-b: storage contains only own data',storeJSON().includes('ISOL-B-MARKER')&&!storeJSON().includes('ISOL-A-MARKER-X'));
    }
  }catch(e){R.notes.push('scenario error: '+String(e&&e.stack||e).slice(0,600));}
  document.getElementById('results').textContent=JSON.stringify(R).replace(/</g,'\\u003c');
  document.title=(R.failed.length?'FAIL':'PASS')+'/'+R.passed+'/'+R.total;
})();
</script>
</body>
</html>
